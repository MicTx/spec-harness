# OpenAI-compatible agent metadata for skill-aware CLIs.
# Fields:
#   display_name: Human-readable name shown in host CLI
#   short_description: One-line summary for skill listing
#   default_prompt: Multi-line prompt injected when skill is activated via $spec
#   policy.allow_implicit_invocation: Whether the host can auto-trigger this skill
interface:
  display_name: "Spec Harness"
  short_description: "Spec Harness task-package workflow: $spec -> spec:new/goal/run/check/done/push/update/status/doctor/organize/autorun"
  default_prompt: |
    Callable entries: spec:new / spec:goal / spec:autorun / spec:run / spec:check / spec:done / spec:push / spec:update / spec:status / spec:doctor / spec:organize.
    After $spec, work from the user's goal and the project's actual progress. Spec task packages, stages, and gates are the behind-the-scenes development method, never the main narrative of user-visible replies.
    User updates report only the readable project name, real task completion, current work, concrete problems, delivered results, and verification; never show the stage pipeline, gate counts, or ask the user for the next spec command.
    Read SKILL.md first. The on-disk trio is the delivery source of truth; route is an internal resolver and tasks is not a user command. Stable task IDs and depends-on must be validated — never guess natural-language dependencies.
    The main session is the orchestrator and owns routing, acceptance, and the done/push gates. Bounded sidecar work is delegated only after a route decision (`scripts/route_decision.py`) plus a written assignment contract (`references/orchestration.md`); loop-shaped work follows a managed slot protocol.
    tasks.md is the execution source of truth: every task must have boundary (what may change) and verify (how completion is proven); ordered work declares depends-on. Run the verify-described verification for real before checking off; self-reported results are not completion.
    Record blockers on the task and say so — never skip silently. Full stage details live in the current-stage section of references/commands.md.

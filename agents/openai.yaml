# OpenAI-compatible agent metadata for skill-aware CLIs.
# Fields:
#   display_name: Human-readable name shown in host CLI
#   short_description: One-line summary for the skill listing (25-64 characters)
#   default_prompt: Short starter prompt injected when the skill is activated via $spec
#   policy.allow_implicit_invocation: Whether the host can auto-trigger this skill
# Runtime rules (stage routing, boundaries, gates) live in SKILL.md and references/;
# this file carries only the listing text the host shows before the skill runs.
interface:
  display_name: "Spec Harness"
  short_description: "Recoverable task packages for multi-step agent work"
  default_prompt: "Use $spec to turn this project's goal into a tracked, verifiable task package."

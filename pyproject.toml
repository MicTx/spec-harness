[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "spec-harness"
version = "0.13.21"
description = "Task-package workflow for AI coding agents with verifiable scope, evidence, and Git gates."
readme = "README.md"
authors = [{name = "Spec Harness contributors"}]
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/MicTx/spec-harness"
Repository = "https://github.com/MicTx/spec-harness"
Issues = "https://github.com/MicTx/spec-harness/issues"
Changelog = "https://github.com/MicTx/spec-harness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests", "slots"]

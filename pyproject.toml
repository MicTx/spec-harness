[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "spec-harness"
version = "0.13.9"
description = "Spec Harness task-package workflow for specification-driven development"
requires-python = ">=3.9"
license = {text = "LicenseRef-Spec-NonCommercial"}

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests", "slots"]

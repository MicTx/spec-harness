name: CI (public)

# Verification for the public repository. The development tree runs its
# own self-hosted pipeline (gateway clone + offline toolchain, no
# `uses:` actions), which is both private and unrunnable on GitHub-hosted
# runners, so this file is the only CI the public tree sees.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    # GitHub-hosted runners exist only for the public repository. The
    # development Gitea instance shares this file through the public
    # export but must not dispatch it (it has no egress for `uses:`).
    if: github.repository == 'MicTx/spec-harness'
    runs-on: ubuntu-latest
    env:
      # Keyless CI semantics: the canonical release payload lives
      # outside the public tree, and signing enforcement would reject
      # the bare-export smoke without throwaway credentials.
      SPEC_RELEASE_PARITY: "1"
      SPEC_SIGNING_IDENTITY: ${{ runner.temp }}/smoke-identity.json
      SPEC_SIGNING_KEY: ${{ runner.temp }}/smoke-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision toolchain
        run: python3 -m pip install --quiet pytest ruff
      - name: Ephemeral signing credentials
        run: |
          printf '%s' '{"holder":"CI Smoke","contact":"ci@invalid","channel":"ci","commercial":"not-permitted"}' > "$RUNNER_TEMP/smoke-identity.json"
          # Base64 keeps the key ASCII-clean; raw bytes can strip below
          # the 32-byte minimum in skill_watermark.load_key.
          head -c 64 /dev/urandom | base64 | tr -d '\n' > "$RUNNER_TEMP/smoke-key"
      - name: Compile Python tree
        run: python3 -m compileall -q scripts server hooks slots tests
      - name: Check installer syntax
        run: bash -n server/install.sh
      - name: Run smoke test
        run: python3 scripts/smoke_test_spec_skill.py
      - name: Validate slots
        run: python3 scripts/slot_registry.py validate
      - name: Run pytest
        run: |
          # The ignored files assert against the private `.spec/`
          # history and the tracked `release/` payload; the public
          # export excludes both by design, so they cannot run here.
          python3 -m pytest tests/ slots/ \
            --ignore=tests/test_release_payload.py \
            --ignore=tests/test_host_evidence_notes.py \
            --ignore=tests/test_module_dag.py \
            --ignore=tests/test_organize_project_structure.py \
            --ignore=tests/test_check_spec_package.py \
            --ignore=tests/test_build_release.py
      - name: Ruff check
        run: ruff check scripts/ server/ hooks/ slots/ tests/
      - name: Ruff format check
        run: ruff format --check scripts/ server/ hooks/ slots/ tests/

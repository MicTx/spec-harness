name: CI (public)

# Verification for the public repository. The development tree runs its
# own self-hosted pipeline (gateway clone + offline toolchain, no
# `uses:` actions), which is both private and unrunnable on GitHub-hosted
# runners, so this file is the only CI the public tree sees.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    # GitHub-hosted runners exist only for the public repository. The
    # development Gitea instance shares this file through the public
    # export but must not dispatch it (it has no egress for `uses:`).
    if: github.repository == 'MicTx/spec-harness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provision toolchain
        run: python3 -m pip install --quiet pytest ruff
      - name: Install from bare export
        run: |
          set -eu
          empty_home="$(mktemp -d)"
          HOME="$empty_home" INSTALL_HOSTS=claude bash install.sh > install.log 2>&1
          test -f "$empty_home/.claude/skills/spec/SKILL.md"
      - name: Compile Python tree
        run: python3 -m compileall -q scripts hooks tests
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Run pytest
        run: |
          python3 -m pytest tests/
      - name: Ruff check
        run: ruff check scripts/ hooks/ tests/
      - name: Ruff format check
        run: ruff format --check scripts/ hooks/ tests/
